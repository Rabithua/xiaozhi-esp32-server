user root;
worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 300;
    client_max_body_size 1024M;
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8002;
        server_name localhost;

        # Resolve Docker DNS per request so management can start before voice.
        location /xiaozhi/v1/ {
            set $voice_backend http://server:8000;
            proxy_pass $voice_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /mcp/vision/ {
            set $vision_backend http://server:8003;
            proxy_pass $vision_backend;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        # The combined web image runs Java inside this same container.
        location /xiaozhi/ {
            proxy_pass http://127.0.0.1:8003;
            proxy_set_header Host $host;
            proxy_set_header Referer $http_referer;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
